<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kayıt Ol - KariyerKoçu AI</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
    <header>
        <div class="container">
            <h1>KariyerKoçu AI</h1>
            <nav>
                <ul>
                <a href="index.html"class="btn">Ana Sayfa</a>
                <a href="login.html" class="btn">Giriş Yap</a>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container auth-container">
            <h2>Kayıt Ol</h2>
            <form action="dashboard.html" method="POST">
                <label for="fullname">Ad Soyad:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Adınız ve Soyadınız" required>
                
                <label for="username">Kullanıcı Adı:</label>
                <input type="text" id="username" name="username" placeholder="Kullanıcı adınızı girin" required>
                
                <label for="email">E-posta:</label>
                <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin" required>
                
                <label for="password">Parola:</label>
                <input type="password" id="password" name="password" placeholder="Parolanızı oluşturun" required>
                
                <label for="confirm_password">Parolayı Onayla:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Parolanızı tekrar girin" required>
                
                <button type="submit" class="btn">Kayıt Ol</button>
            </form>
            <p>Zaten hesabınız var mı? <a href="login.html">Giriş Yapın</a></p>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 Berkan Çalışkan | Kariyer Koçu AI | Tüm hakları saklıdır.</p>
        </div>
    </footer>
</body>
</html>
